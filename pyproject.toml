[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "CADRE"
dynamic = ["version"]
description = "Implementation of the CADRE CubeSat design problem for OpenMDAO 4 and dymos4"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Kenneth T. Moore", email = "kenneth.t.moore-1@nasa.gov" },
]
maintainers = [
    { name = "Kenneth T. Moore", email = "kenneth.t.moore-1@nasa.gov" },
]
keywords = [
    "CADRE",
    "openmdao",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

# om4 and dymos4 are not on PyPI yet; pixi.toml installs them from sibling
# checkouts.
dependencies = [
    "jax",
    "numpy>=2.0",
    "scipy",
]

[tool.hatch.metadata]
allow-direct-references = true

[project.optional-dependencies]
all = [
    "CADRE[MBI,test]",
]
MBI = [
    "MBI@git+https://github.com/OpenMDAO/MBI",
]
test = [
    "parameterized",
    "testflo",
]

[project.urls]
Download = "http://github.com/OpenMDAO/CADRE.git"
Homepage = "http://github.com/OpenMDAO/CADRE.git"

[tool.hatch.version]
path = "CADRE/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/CADRE",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
# O is the conventional name for the orientation matrices here.
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
