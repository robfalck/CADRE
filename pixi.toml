[workspace]
name = "CADRE"
version = "0.2.0"
description = "Pixi environment for CADRE on OpenMDAO 4 (om4) and dymos4."
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[dependencies]
python = ">=3.12"
pip = "*"
numpy = "*"
scipy = "*"
networkx = "*"
# Matches dymos4: om4 main fails to serialize some fields under pydantic 2.14.
pydantic = ">=2.13,<2.14"
pydantic-core = "*"
rich = ">=15.0.0,<16"
structlog = ">=24.0.0"
pyoptsparse = ">=2.14.0"
# pyoptsparse imports cyipopt for its IPOPT wrapper.
cyipopt = "*"

[target.win-64.dependencies]
# Same BLAS pin as dymos4 (see its pixi.toml): MKL 2026.1 and OpenBLAS 0.3.34
# both crash on win-64, so use a pthreads OpenBLAS before 0.3.34.
libblas = { version = "*", build = "*openblas" }
libopenblas = { version = "<0.3.34", build = "pthreads*" }

[feature.dev.dependencies]
ruff = ">=0.15.7,<0.16"
matplotlib = ">=3.11.0,<4"
parameterized = "*"
testflo = "*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[pypi-dependencies]
# CADRE itself, installed editable from this repo.
CADRE = { path = ".", editable = true }
# OpenMDAO 4 and dymos4, installed editable from sibling checkouts.
om4 = { path = "../om4.git", editable = true }
dymos4 = { path = "../dymos4.git", editable = true }
# om4 dependencies
nicegui = "*"
# asdex 0.5.2 (latest) imports jax._src.core.ClosedJaxpr, which jax 0.12 removed.
jax = ">=0.11,<0.12"
jaxlib = ">=0.11,<0.12"
asdex = "*"
pyxdsm = ">=2.3.2, <3"

[environments]
default = { features = ["py313", "dev"] }
py312 = { features = ["py312", "dev"] }

[activation]
env = { JAX_PLATFORMS = "cpu" }

[tasks]
# Only the om4/dymos4 ports are tested here; the legacy OpenMDAO 2.x model
# (CADRE/*.py at the top level and CADRE/test) still needs classic OpenMDAO.
test = "testflo CADRE/attitude_dymos CADRE/orbital_equations CADRE/test/test_reactionwheel_dymos.py CADRE/test/test_sun_dymos.py -f"
lint = "ruff check CADRE/attitude_dymos CADRE/orbital_equations CADRE/reactionwheel_dymos.py CADRE/sun_dymos.py CADRE/testing_utils.py CADRE/test/test_reactionwheel_dymos.py CADRE/test/test_sun_dymos.py"
